name: Refine submenu fixed backgrounds patch

on:
  push:
    branches:
      - feature/submenu-fixed-backgrounds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/submenu-fixed-backgrounds
          fetch-depth: 0

      - name: Refine conditions and validate XML
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          shortcuts_path = Path("1080i/script-skinshortcuts.xml")
          shortcuts = shortcuts_path.read_text(encoding="utf-8")
          old_visibility = (
              '<visible>String.IsEmpty(Window(Home).Property(skinshortcuts-Widget)) | '
              'String.IsEqual(Window(Home).Property(Backg),yes)</visible>'
          )
          new_visibility = (
              '<visible>[!String.IsEqual(Window.Property(groupname),powermenu) + '
              'String.IsEmpty(Window(Home).Property(skinshortcuts-Widget))] | '
              'String.IsEqual(Window(Home).Property(Backg),yes)</visible>'
          )
          if shortcuts.count(old_visibility) != 1:
              raise SystemExit(
                  f"Expected one submenu background visibility rule, found {shortcuts.count(old_visibility)}"
              )
          shortcuts_path.write_text(
              shortcuts.replace(old_visibility, new_visibility, 1), encoding="utf-8"
          )

          includes_path = Path("1080i/Includes.xml")
          includes = includes_path.read_text(encoding="utf-8")
          old_rule = (
              '<value condition="Window.IsVisible(home) + Control.HasFocus(302) + '
              '!String.IsEmpty(Container(302).ListItem.Property(background))">'
              '$INFO[Container(302).ListItem.Property(background)]</value>'
          )
          new_rule = (
              '<value condition="Window.IsVisible(home) + Control.HasFocus(302) + '
              '!String.IsEmpty(Container(302).ListItem.Property(background)) + '
              '!String.IsEqual(Container(302).ListItem.Property(background),playlistBackground)">'
              '$INFO[Container(302).ListItem.Property(background)]</value>'
          )
          if includes.count(old_rule) != 1:
              raise SystemExit(
                  f"Expected one submenu background runtime rule, found {includes.count(old_rule)}"
              )
          includes_path.write_text(
              includes.replace(old_rule, new_rule, 1), encoding="utf-8"
          )

          ET.parse(shortcuts_path)
          ET.parse(includes_path)

      - name: Commit refinement and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-submenu-fixed-backgrounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine submenu background conditions"
          git push origin HEAD:feature/submenu-fixed-backgrounds
