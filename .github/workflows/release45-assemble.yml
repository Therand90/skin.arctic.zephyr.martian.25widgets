name: Assemble 25widgets.45 code

on:
  push:
    branches:
      - release/25widgets.45
    paths:
      - .github/workflows/release45-assemble.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/release45-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/25widgets.45
          fetch-depth: 0

      - name: Rebuild and verify validated code patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          parts = []
          for n in range(1, 7):
              parts.append(Path(f'tools/release45-code.patch.gz.b64.{n:02d}').read_text().strip())

          # Part 07a suffered two transcription errors while being staged through
          # the API. Repair the two known character positions deterministically,
          # then verify the complete stream against the SHA-256 of the local
          # Kodi-tested .45 patch before decoding anything.
          p7a = Path('tools/release45-code.patch.gz.b64.07a').read_text().strip()
          assert len(p7a) == 1251, len(p7a)
          p7a = p7a[:408] + 'E' + p7a[410:]
          p7a = p7a[:966] + 'J' + p7a[967:]
          assert len(p7a) == 1250, len(p7a)
          parts.append(p7a)
          parts.append(Path('tools/release45-code.patch.gz.b64.07b').read_text().strip())
          parts.append(Path('tools/release45-code.patch.gz.b64.08').read_text().strip())

          payload = ''.join(parts)
          digest = hashlib.sha256(payload.encode()).hexdigest()
          print('base64 length:', len(payload))
          print('base64 sha256:', digest)
          assert len(payload) == 18820
          assert digest == 'cc55ad6dacf141db91e7ad900d39141917741880c2198b7b897b984bc3a846cd'
          Path('/tmp/release45-code.patch.gz.b64').write_text(payload)
          PY
          base64 --decode /tmp/release45-code.patch.gz.b64 \
            | gzip --decompress > /tmp/release45-code.patch
          git apply --check /tmp/release45-code.patch
          git apply /tmp/release45-code.patch

      - name: Validate Kodi XML and release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          xmls = list(Path('.').rglob('*.xml'))
          for path in xmls:
              ET.parse(path)
          print(f'{len(xmls)} XML files parsed successfully')
          PY
          grep -q 'TherandInline45' shortcuts/template.xml
          grep -q 'therand_inline45.py,back' 1080i/Includes_Widgets.xml
          grep -q 'include.widget.pvrchannelgroup' 1080i/Includes_Widgets.xml
          grep -q 'TherandPVR.ChannelGroups' 1080i/Includes.xml
          grep -q 'colordiffuse="66FFFFFF"' 1080i/Includes_PVR.xml
          grep -q 'version="3.19.11+25widgets.45"' addon.xml

      - name: Commit assembled stable code
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/release45-code.patch.gz.b64.*
          rm -f .github/workflows/release45-assemble.yml
          git config user.name 'Therand90'
          git config user.email '135005486+Therand90@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish PVR and inline navigation code through 25widgets.45'
          git push origin HEAD:release/25widgets.45
