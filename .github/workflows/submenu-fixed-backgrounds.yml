name: Apply submenu fixed backgrounds patch

on:
  push:
    branches:
      - feature/submenu-fixed-backgrounds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/submenu-fixed-backgrounds
          fetch-depth: 0

      - name: Patch skin files
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          shortcuts_path = Path("1080i/script-skinshortcuts.xml")
          shortcuts = shortcuts_path.read_text(encoding="utf-8")

          old_visibility = (
              '<visible>[String.IsEqual(Window.Property(groupname),mainmenu) + '
              'String.IsEmpty(Window(Home).Property(skinshortcuts-Widget))] | '
              'String.IsEqual(Window(Home).Property(Backg),yes)</visible>'
          )
          new_visibility = (
              '<visible>String.IsEmpty(Window(Home).Property(skinshortcuts-Widget)) | '
              'String.IsEqual(Window(Home).Property(Backg),yes)</visible>'
          )

          if shortcuts.count(old_visibility) != 1:
              raise SystemExit(
                  f"Expected one background visibility rule, found {shortcuts.count(old_visibility)}"
              )

          shortcuts = shortcuts.replace(old_visibility, new_visibility, 1)
          shortcuts_path.write_text(shortcuts, encoding="utf-8")

          includes_path = Path("1080i/Includes.xml")
          includes = includes_path.read_text(encoding="utf-8")

          anchor = (
              '\t\t<!-- Weather -->\n'
              '        <value condition="Window.IsVisible(weather) + '
              '[$EXP[HasWeatherFanartSingle] | $EXP[HasWeatherFanartMulti]]">'
              '$VAR[Image_WeatherCurrent]</value>\n'
          )
          submenu_background = (
              '\n        <!-- Fixed background for the focused home submenu item -->\n'
              '        <value condition="Window.IsVisible(home) + Control.HasFocus(302) + '
              '!String.IsEmpty(Container(302).ListItem.Property(background))">'
              '$INFO[Container(302).ListItem.Property(background)]</value>\n'
          )

          if includes.count(anchor) != 1:
              raise SystemExit(
                  f"Expected one GlobalFanart weather anchor, found {includes.count(anchor)}"
              )
          if "Fixed background for the focused home submenu item" in includes:
              raise SystemExit("Submenu background rule is already present")

          includes = includes.replace(anchor, anchor + submenu_background, 1)
          includes_path.write_text(includes, encoding="utf-8")

          ET.parse(shortcuts_path)
          ET.parse(includes_path)

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/submenu-fixed-backgrounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add fixed backgrounds for home submenu items"
          git push origin HEAD:feature/submenu-fixed-backgrounds
